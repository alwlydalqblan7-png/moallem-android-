name: Deploy Moallem Sync Worker

on:
  workflow_dispatch:
  push:
    branches: [main, feature/automatic-cloud-sync-2026-11, feature/fix-sync-account-backup-2026]
    paths:
      - "cloudflare-sync/**"
      - ".github/workflows/deploy-sync-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy encrypted sync service
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-sync
          command: deploy
