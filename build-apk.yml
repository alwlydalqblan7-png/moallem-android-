name: Build Moallem V2.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Generate Android adaptive icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1C3F66' --iconBackgroundColorDark '#1C3F66' --splashBackgroundColor '#1C3F66' --splashBackgroundColorDark '#1C3F66'
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moallem-V2.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
